name: Minimal Linux Build (QEMU + Busybox + init)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-busybox-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout empty repo (optional)
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gcc make bc bison flex libssl-dev libelf-dev qemu-system-x86 wget cpio

      - name: Download Linux kernel (lts)
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.93.tar.xz
          tar -xf linux-6.1.93.tar.xz

      - name: Default kernel config
        working-directory: linux-6.1.93
        run: make defconfig

      - name: Minimal kernel options (initramfs support)
        working-directory: linux-6.1.93
        run: |
          scripts/config --enable BLK_DEV_INITRD
          scripts/config --enable RD_GZIP
          scripts/config --enable DEVTMPFS
          scripts/config --enable DEVTMPFS_MOUNT
          yes '' | make olddefconfig

      - name: Download and build BusyBox (static)
        run: |
          wget https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar -xf busybox-1.36.1.tar.bz2
          cd busybox-1.36.1
          make defconfig
          sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          make -j$(nproc)
          make install
        
      - name: Prepare initramfs (init + busybox)
        run: |
          mkdir -p initramfs/{bin,sbin,etc,proc,sys,usr/bin,usr/sbin,dev}
          cp -a busybox-1.36.1/_install/* initramfs/
          cat > initramfs/init << 'EOF'
          #!/bin/sh
          mount -t proc proc /proc
          mount -t sysfs sys /sys
          mount -t devtmpfs dev /dev
          echo
          echo "=== Minimal Linux Booted via GitHub Actions ==="
          echo
          /bin/sh
          EOF
          chmod +x initramfs/init
          cd initramfs
          find . | cpio -H newc -o | gzip > ../initramfs.img.gz
          cd ..
        
      - name: Build the kernel with built-in initramfs
        working-directory: linux-6.1.93
        run: |
          cp ../initramfs.img.gz .
          sed -i '/CONFIG_INITRAMFS_SOURCE=/d' .config
          echo 'CONFIG_INITRAMFS_SOURCE="initramfs.img.gz"' >> .config
          yes '' | make olddefconfig
          make -j$(nproc)
        
      - name: Boot with QEMU (headless, smoke test)
        run: |
          cd linux-6.1.93
          qemu-system-x86_64 -kernel arch/x86/boot/bzImage -m 256M \
          -nographic -no-reboot -append "console=ttyS0" \
          || true
          
