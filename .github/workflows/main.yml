# .github/workflows/build-kernel-aarch64.yml
name: Build ARM64 Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            xz-utils \
            wget

      - name: Kernel cache
        uses: actions/cache@v4
        with:
          path: linux-*.tar.xz
          key: kernel-6.7-tarball

      - name: Download kernel source
        run: |
          KVER="6.7"
          if [ ! -f linux-${KVER}.tar.xz ]; then
            wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KVER}.tar.xz
          fi

      - name: Extract kernel source
        run: |
          KVER="6.7"
          KDIR="linux-$KVER"
          rm -rf $KDIR
          XZ_OPT="-T0" tar -xf linux-${KVER}.tar.xz

      - name: Configure and build kernel
        working-directory: linux-6.7
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          MAKEFLAGS: "-j$(nproc)"
          KCFLAGS: "-O2"
          KBUILD_BUILD_TIMESTAMP: ""
          KBUILD_BUILD_USER: "miko"
        run: |
          
          make ARCH=arm64 defconfig
          make ARCH=arm64 olddefconfig
          
          
          scripts/config \
            -e CONFIG_EXT4_FS \
            -e CONFIG_PROC_FS \
            -e CONFIG_SYSFS \
            -e CONFIG_DEVTMPFS \
            -e CONFIG_DEVTMPFS_MOUNT \
            -e CONFIG_NET \
            -e CONFIG_INET \
            -e CONFIG_VIRTIO \
            -e CONFIG_VIRTIO_PCI \
            -e CONFIG_VIRTIO_BLK \
            -e CONFIG_SMP \
            -e CONFIG_TMPFS \
            -e CONFIG_UNIX
          
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-aarch64-Image
          path: linux-6.7/arch/arm64/boot/Image
          
