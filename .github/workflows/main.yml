# .github/workflows/build-kernel-aarch64.yml
name: Build ARM64 Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex \
            libssl-dev libelf-dev \
            xz-utils wget cpio

      - name: Cache kernel tarball
        uses: actions/cache@v4
        with:
          path: linux-6.7.tar.xz
          key: kernel-6.7

      - name: Download kernel
        run: |
          if [ ! -f linux-6.7.tar.xz ]; then
            wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.7.tar.xz
          fi

      - name: Extract
        run: |
          rm -rf linux-6.7
          XZ_OPT="-T0" tar -xf linux-6.7.tar.xz

      - name: Configure
        working-directory: linux-6.7
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make defconfig
          make olddefconfig

          scripts/config \
            -e CONFIG_EXT4_FS \
            -e CONFIG_PROC_FS \
            -e CONFIG_SYSFS \
            -e CONFIG_TMPFS \
            -e CONFIG_TMPFS_POSIX_ACL \
            -e CONFIG_DEVTMPFS \
            -e CONFIG_DEVTMPFS_MOUNT \
            -e CONFIG_BLK_DEV_INITRD \
            -e CONFIG_NET \
            -e CONFIG_INET \
            -e CONFIG_PACKET \
            -e CONFIG_UNIX \
            -e CONFIG_VIRTIO \
            -e CONFIG_VIRTIO_PCI \
            -e CONFIG_VIRTIO_BLK \
            -e CONFIG_VIRTIO_NET \
            -e CONFIG_NETDEVICES \
            -e CONFIG_9P_FS \
            -e CONFIG_NET_9P \
            -e CONFIG_NET_9P_VIRTIO

          make olddefconfig

      - name: Build kernel
        working-directory: linux-6.7
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make -j$(nproc)

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-aarch64
          path: |
            linux-6.7/arch/arm64/boot/Image
            linux-6.7/.config
