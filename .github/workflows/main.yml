name: Build Minimal Rootfs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev fakeroot cpio gzip xz-utils dosfstools parted mtools

      - name: Create workspace
        run: mkdir -p $GITHUB_WORKSPACE/{build,rootfs,mnt}

      - name: Download and extract BusyBox
        working-directory: ${{ github.workspace }}/build
        run: |
          wget -q https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar -xjf busybox-1.36.1.tar.bz2

      - name: Build BusyBox static
        working-directory: ${{ github.workspace }}/build/busybox-1.36.1
        run: |
          make defconfig
          sed -i 's/.*CONFIG_STATIC.*/CONFIG_STATIC=y/' .config
          sed -i 's/.*CONFIG_INETD.*/CONFIG_INETD=n/' .config
          sed -i 's/.*CONFIG_FEATURE_INETD_SUPPORT.*/CONFIG_FEATURE_INETD_SUPPORT=n/' .config
          sed -i 's/.*CONFIG_FEATURE_WTMP.*/CONFIG_FEATURE_WTMP=n/' .config
          sed -i 's/.*CONFIG_FEATURE_UTMP.*/CONFIG_FEATURE_UTMP=n/' .config
          make -j$(nproc)
          make CONFIG_PREFIX=$GITHUB_WORKSPACE/rootfs install

      - name: Assemble rootfs
        working-directory: ${{ github.workspace }}/rootfs
        run: |
          mkdir -p dev proc sys tmp run etc/init.d root

          cat > init << 'EOF'
          #!/bin/sh
          mount -t devtmpfs devtmpfs /dev
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t tmpfs none /tmp
          mount -t tmpfs none /run
          /sbin/mdev -s
          ip link set lo up
          exec /bin/sh
          EOF
          chmod +x init

          cat > etc/inittab << 'EOF'
          ::sysinit:/etc/init.d/rcS
          ::respawn:-/bin/sh
          ::ctrlaltdel:/sbin/reboot
          ::shutdown:/bin/umount -a -r
          EOF

          cat > etc/init.d/rcS << 'EOF'
          #!/bin/sh
          mount -a
          EOF
          chmod +x etc/init.d/rcS

          cat > etc/fstab << 'EOF'
          proc    /proc   proc    defaults    0    0
          sysfs   /sys    sysfs   defaults    0    0
          devtmpfs /dev   devtmpfs mode=0755  0    0
          tmpfs   /tmp    tmpfs   mode=1777   0    0
          tmpfs   /run    tmpfs   mode=0755   0    0
          EOF

      - name: Create 1GB ext4 disk image
        working-directory: ${{ github.workspace }}
        run: |
          dd if=/dev/zero of=disk.img bs=1M count=1024
          parted -s disk.img mklabel gpt
          parted -s disk.img mkpart rootfs ext4 1MiB 100%
          LOOPDEV=$(sudo losetup -f --show -P disk.img)
          sleep 1
          sudo mkfs.ext4 -F -L rootfs ${LOOPDEV}p1
          sudo mount ${LOOPDEV}p1 $GITHUB_WORKSPACE/mnt
          sudo cp -a $GITHUB_WORKSPACE/rootfs/* $GITHUB_WORKSPACE/mnt/
          sudo umount $GITHUB_WORKSPACE/mnt
          sudo losetup -d ${LOOPDEV}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minimal-rootfs
          path: |
            ${{ github.workspace }}/disk.img
            ${{ github.workspace }}/rootfs/
          retention-days: 30
          
