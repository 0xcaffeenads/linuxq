name: Build Minimal Rootfs

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BUSYBOX_VERSION: "1.38.0"
  CURL_VERSION: "8.12.1"
  GIT_VERSION: "2.49.0"
  NANO_VERSION: "8.4"
  ARCH: x86_64
  JOBS: $(nproc)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex libncurses-dev \
            libssl-dev libcurl4-openssl-dev libexpat1-dev \
            gettext zlib1g-dev rsync bc texinfo \
            fakeroot cpio gzip xz-utils \
            libzstd-dev libpcre2-dev \
            dosfstools parted mtools

      - name: Create workspace
        run: mkdir -p $GITHUB_WORKSPACE/{build,rootfs,mnt}

      - name: Download and extract sources
        working-directory: ${{ github.workspace }}/build
        run: |
          wget -q https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2 -O busybox.tar.bz2
          wget -q https://github.com/curl/curl/releases/download/curl-${CURL_VERSION//./_}/curl-${CURL_VERSION}.tar.gz -O curl.tar.gz
          wget -q https://mirrors.edge.kernel.org/pub/software/scm/git/git-${GIT_VERSION}.tar.gz -O git.tar.gz
          wget -q https://www.nano-editor.org/dist/v8/nano-${NANO_VERSION}.tar.xz -O nano.tar.xz

          tar -xjf busybox.tar.bz2
          tar -xzf curl.tar.gz
          tar -xzf git.tar.gz
          tar -xJf nano.tar.xz

      - name: Build BusyBox (dynamic, host glibc)
        working-directory: ${{ github.workspace }}/build/busybox-${BUSYBOX_VERSION}
        run: |
          make defconfig
          sed -i 's/.*CONFIG_STATIC.*/CONFIG_STATIC=n/' .config
          sed -i 's/.*CONFIG_INETD.*/CONFIG_INETD=n/' .config
          sed -i 's/.*CONFIG_FEATURE_INETD_SUPPORT.*/CONFIG_FEATURE_INETD_SUPPORT=n/' .config
          sed -i 's/.*CONFIG_FEATURE_WTMP.*/CONFIG_FEATURE_WTMP=n/' .config
          sed -i 's/.*CONFIG_FEATURE_UTMP.*/CONFIG_FEATURE_UTMP=n/' .config
          make -j${{ env.JOBS }}
          make CONFIG_PREFIX=${{ github.workspace }}/rootfs install

      - name: Build curl
        working-directory: ${{ github.workspace }}/build/curl-${CURL_VERSION}
        run: |
          ./configure \
            --prefix=/usr \
            --with-openssl \
            --disable-shared \
            --enable-static \
            CC="gcc"
          make -j${{ env.JOBS }}
          make install DESTDIR=${{ github.workspace }}/rootfs

      - name: Build git
        working-directory: ${{ github.workspace }}/build/git-${GIT_VERSION}
        run: |
          make configure
          ./configure \
            --prefix=/usr \
            --without-tcltk \
            --without-python \
            --without-expat \
            --with-curl \
            --with-openssl \
            CFLAGS="-O2"
          make -j${{ env.JOBS }}
          make install DESTDIR=${{ github.workspace }}/rootfs

      - name: Build nano
        working-directory: ${{ github.workspace }}/build/nano-${NANO_VERSION}
        run: |
          ./configure \
            --prefix=/usr \
            --disable-nls \
            --disable-utf8
          make -j${{ env.JOBS }}
          make install DESTDIR=${{ github.workspace }}/rootfs

      - name: Assemble rootfs
        working-directory: ${{ github.workspace }}/rootfs
        run: |
          mkdir -p dev proc sys tmp run etc/init.d usr/bin usr/sbin lib lib64 root boot

          cat > init << 'EOFINIT'
          #!/bin/sh
          mount -t devtmpfs devtmpfs /dev
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t tmpfs none /tmp
          mount -t tmpfs none /run

          echo /sbin/mdev > /proc/sys/kernel/hotplug
          /sbin/mdev -s

          ip link set lo up
          mkdir -p /dev/pts
          mount -t devpts devpts /dev/pts

          cat << 'EOF'

          Minimal Linux (BusyBox init)
          Boot took $(cut -d' ' -f1 /proc/uptime) seconds

          EOF

          exec /bin/sh
          EOFINIT

          chmod +x init

          cat > etc/inittab << 'EOFTAB'
          ::sysinit:/etc/init.d/rcS
          ::respawn:-/bin/sh
          ::ctrlaltdel:/sbin/reboot
          ::shutdown:/sbin/swapoff -a
          ::shutdown:/bin/umount -a -r
          EOFTAB

          cat > etc/init.d/rcS << 'EOFRC'
          #!/bin/sh
          mount -a
          echo "rcS done"
          EOFRC
          chmod +x etc/init.d/rcS

          cat > etc/fstab << 'EOFFSTAB'
          proc    /proc   proc    defaults        0       0
          sysfs   /sys    sysfs   defaults        0       0
          devtmpfs /dev   devtmpfs mode=0755      0       0
          tmpfs   /tmp    tmpfs   mode=1777       0       0
          tmpfs   /run    tmpfs   mode=0755       0       0
          EOFFSTAB

          cat > etc/passwd << 'EOFPASS'
          root::0:0:root:/root:/bin/sh
          EOFPASS

          cat > etc/group << 'EOFGROUP'
          root:x:0:
          EOFGROUP

          cat > etc/resolv.conf << 'EOFRESOLV'
          nameserver 8.8.8.8
          nameserver 1.1.1.1
          EOFRESOLV

          cp -a /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 lib64/
          cp -a /lib/x86_64-linux-gnu/libc.so* lib/
          cp -a /lib/x86_64-linux-gnu/libm.so* lib/
          cp -a /lib/x86_64-linux-gnu/libdl.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libpthread.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libresolv.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libnss_dns.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/librt.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libcrypt.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libutil.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libz.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libssl.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libcrypto.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libpcre2-8.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libcurl.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libnghttp2.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libidn2.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libunistring.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libpsl.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libssh2.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libgssapi_krb5.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libkrb5.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libk5crypto.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libcom_err.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libkrb5support.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libkeyutils.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libresolv.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libnsl.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libtirpc.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libwrap.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libselinux.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libpcre.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libaudit.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libcap.so* lib/ || true
          cp -a /lib/x86_64-linux-gnu/libc.so* lib/
          cp -a /lib/x86_64-linux-gnu/libexpat.so* lib/ || true
          cp -a /usr/lib/x86_64-linux-gnu/libcurl.so* usr/lib/ || true

          ln -sf /bin/busybox linuxrc

      - name: Create 1GB ext4 disk image
        working-directory: ${{ github.workspace }}
        run: |
          dd if=/dev/zero of=disk.img bs=1M count=1024
          parted -s disk.img mklabel gpt
          parted -s disk.img mkpart rootfs ext4 1MiB 100%
          LOOPDEV=$(sudo losetup -f --show -P disk.img)
          sleep 1
          sudo mkfs.ext4 -F -L rootfs ${LOOPDEV}p1
          sudo mount ${LOOPDEV}p1 ${{ github.workspace }}/mnt
          sudo cp -a ${{ github.workspace }}/rootfs/* ${{ github.workspace }}/mnt/
          sudo umount ${{ github.workspace }}/mnt
          sudo losetup -d ${LOOPDEV}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minimal-rootfs
          path: |
            ${{ github.workspace }}/disk.img
            ${{ github.workspace }}/rootfs/
          
